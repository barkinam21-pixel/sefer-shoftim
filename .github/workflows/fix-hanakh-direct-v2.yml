name: Guard HaNakh HaBahir availability

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 21 chapters stay truthful and directly reachable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          s = Path("index.html").read_text(encoding="utf-8")
          a = s.index("const DATA=") + len("const DATA=")
          b = s.index(";let filter=", a)
          data = json.loads(s[a:b])

          items = [
              x for x in data["items"]
              if x.get("title", "").startswith("הנ״ך הבהיר — שופטים פרק ")
          ]

          errors = []
          if len(items) != 21:
              errors.append(f"Expected 21 HaNakh chapters, found {len(items)}")

          for x in items:
              if x.get("yt") or x.get("embed"):
                  errors.append(f'{x["title"]}: must not be counted as embedded while the owner blocks embeds')
              url = x.get("url") or ""
              if not url.startswith("https://www.youtube.com/watch?v="):
                  errors.append(f'{x["title"]}: missing direct chapter URL')
              if not x.get("thumbYT"):
                  errors.append(f'{x["title"]}: missing thumbnail id')
              if "חסם ניגון בתוך אתרים אחרים" not in (x.get("note") or ""):
                  errors.append(f'{x["title"]}: missing truthful embed-blocked note')

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("All 21 HaNakh HaBahir chapters remain in chronology with thumbnails and direct URLs, without falsely claiming an internal embed.")
          PY
