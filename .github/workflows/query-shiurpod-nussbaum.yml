name: Query Kol Halashon legacy API for Nussbaum Judges
on:
  push:
    branches: [hanakh-crop-final]
    paths:
      - ".github/workflows/query-shiurpod-nussbaum.yml"
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search legacy API with official referer
        run: |
          python3 - <<'PY'
          import requests,json,re
          base='https://www2.kolhalashon.com:444/api/'
          H={
            'Referer':'https://www2.kolhalashon.com/',
            'Origin':'https://www2.kolhalashon.com',
            'User-Agent':'Mozilla/5.0',
            'Accept':'application/json, text/plain, */*'
          }
          s=requests.Session()
          q='רפאל נוסבוים'
          u=base+'Search/WebSite_GetSearchItems/'+requests.utils.quote(q,safe='')+'/-1/1/50'
          r=s.get(u,headers=H,timeout=30)
          print('SEARCH_STATUS',r.status_code,'LEN',len(r.text),'TYPE',r.headers.get('content-type'))
          print('SEARCH_BODY',r.text[:30000])
          data=[]
          try:data=r.json()
          except: pass
          ids=[]
          if isinstance(data,list):
            for x in data:
              blob=json.dumps(x,ensure_ascii=False)
              if 'נוסבוים' in blob:
                print('SEARCH_MATCH',blob)
                for k in ['SearchItemId','SearchItemID','RavID','Id','ID']:
                  if x.get(k) is not None:
                    try: ids.append(int(x[k]))
                    except: pass
          ids=list(dict.fromkeys(ids))
          print('CANDIDATE_IDS',ids)
          for rid in ids:
            payload={
              'RavID':rid,
              'FromRow':0,
              'NumOfRows':3000,
              'OrderBy':7,
              'PrefferedLanguage':0,
              'FiltersArray':[]
            }
            rr=s.post(base+'Search/WebSite_GetRavShiurim/',headers={**H,'Content-Type':'application/json'},json=payload,timeout=60)
            print('\nRAV',rid,'STATUS',rr.status_code,'LEN',len(rr.text))
            try: arr=rr.json()
            except Exception:
              print(rr.text[:5000]); continue
            print('RAV_TYPE',type(arr).__name__,'COUNT',len(arr) if isinstance(arr,list) else '?')
            if isinstance(arr,list):
              hits=[]
              for x in arr:
                blob=json.dumps(x,ensure_ascii=False)
                if 'שופטים' in blob or 'Shoftim' in blob or 'Judges' in blob:
                  hits.append(x)
              print('JUDGES_HITS',len(hits))
              for x in hits[:200]:
                print('HIT',json.dumps(x,ensure_ascii=False))
          PY
