name: Discover Kol Halashon Judges source IDs
on:
  push:
    branches: [hanakh-crop-final]
    paths:
      - ".github/workflows/discover-kol-judges.yml"
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search indexed official lesson URLs via Bing
        run: |
          python3 - <<'PY'
          import requests,re,html,urllib.parse,time
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36'}
          chapters=['א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב','יג','יד','טו','טז','יז','יח','יט','כ','כא']
          for ch in chapters:
            q=f'"פרק {ch}, שופטים" "רפאל נוסבוים"'
            u='https://www.bing.com/search?count=30&q='+urllib.parse.quote(q)
            r=requests.get(u,headers=H,timeout=20)
            print('\nCHAPTER',ch,'STATUS',r.status_code,'LEN',len(r.text))
            found=[]
            for m in re.finditer(r'<li class="b_algo".*?</li>',r.text,re.I|re.S):
              block=m.group(0)
              mm=re.search(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',block,re.I|re.S)
              if not mm: continue
              href=html.unescape(mm.group(1)); title=re.sub(r'<[^>]+>',' ',mm.group(2))
              title=html.unescape(re.sub(r'\s+',' ',title)).strip()
              sn=re.search(r'<p>(.*?)</p>',block,re.I|re.S)
              snip=html.unescape(re.sub(r'<[^>]+>',' ',sn.group(1))) if sn else ''
              if 'kolhalashon' in href or 'glat.tube' in href or 'נוסבוים' in title+snip or 'שופטים' in title+snip:
                found.append((href,title,re.sub(r'\s+',' ',snip).strip()))
            for x in found[:10]: print('RESULT',repr(x))
            time.sleep(.3)
          PY
