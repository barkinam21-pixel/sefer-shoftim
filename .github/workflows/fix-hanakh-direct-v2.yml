name: Guard HaNakh HaBahir embeds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify blocked HaNakh videos stay external
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          s = Path("index.html").read_text(encoding="utf-8")
          a = s.index("const DATA=") + len("const DATA=")
          b = s.index(";let filter=", a)
          data = json.loads(s[a:b])

          items = [
              x for x in data["items"]
              if x.get("title", "").startswith("הנ״ך הבהיר — שופטים פרק ")
          ]

          errors = []
          if len(items) != 21:
              errors.append(f"Expected 21 HaNakh chapters, found {len(items)}")

          for x in items:
              if x.get("yt"):
                  errors.append(f'{x["title"]}: blocked YouTube embed was re-enabled')
              url = x.get("url") or ""
              if not url.startswith("https://www.youtube.com/watch?v="):
                  errors.append(f'{x["title"]}: missing direct YouTube fallback')

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("All 21 HaNakh HaBahir chapters are correctly marked as external fallbacks.")
          PY
