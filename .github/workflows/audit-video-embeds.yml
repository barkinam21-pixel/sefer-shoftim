name: Audit all video embeds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: |
          google-chrome --version
          npm install --no-save playwright-core@latest
      - name: Test every embed on the matching live production version
        run: |
          cat > audit-live.mjs <<'JS'
          import fs from 'fs';
          import { chromium } from 'playwright-core';

          const SITE='https://shoftim-v3.vercel.app/';
          const localHtml=fs.readFileSync('index.html','utf8');
          const localMatch=localHtml.match(/const DATA=(\{.*?\});let filter=/s);
          if(!localMatch) throw new Error('Local DATA not found');
          const expected=JSON.parse(localMatch[1]);
          const expectedTotal=expected.items.length;
          const expectedYt=expected.items.filter(x=>x.yt).length;
          const expectedEmbed=expected.items.filter(x=>x.embed).length;

          const browser=await chromium.launch({
            channel:'chrome',
            headless:true,
            args:['--autoplay-policy=no-user-gesture-required']
          });

          // Wait for Vercel's canonical production alias to serve this commit's data.
          const seed=await browser.newPage();
          let matched=false;
          for(let n=0;n<30;n++){
            await seed.goto(SITE+'?audit='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            try{
              const live=await seed.evaluate(()=>({
                total:DATA.items.length,
                yt:DATA.items.filter(x=>x.yt).length,
                embed:DATA.items.filter(x=>x.embed).length
              }));
              console.log('LIVE_VERSION',JSON.stringify(live),'EXPECTED',JSON.stringify({
                total:expectedTotal,yt:expectedYt,embed:expectedEmbed
              }));
              if(live.total===expectedTotal && live.yt===expectedYt && live.embed===expectedEmbed){
                matched=true; break;
              }
            }catch(e){}
            await seed.waitForTimeout(3000);
          }
          if(!matched) throw new Error('Live production never matched this commit');

          await seed.waitForFunction(()=>window.YT && YT.Player && typeof play==='function',null,{timeout:20000});
          const liveItems=await seed.evaluate(()=>DATA.items.map(x=>({
            ch:x.ch,title:x.title,yt:x.yt||null,embed:x.embed||null
          })));
          await seed.close();

          const ytItems=liveItems.filter(x=>x.yt);
          const frameItems=liveItems.filter(x=>x.embed);
          const results=[];
          const bad=[];

          let nextYt=0;
          async function ytWorker(){
            const page=await browser.newPage();
            await page.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.YT && YT.Player && typeof play==='function',null,{timeout:20000});
            while(true){
              const idx=nextYt++;
              if(idx>=ytItems.length) break;
              const item=ytItems[idx];
              let status='TIMEOUT';
              try{
                await page.evaluate(({id})=>{
                  const x=DATA.items.find(y=>y.yt===id);
                  if(!x) throw new Error('item missing');
                  play(x);
                },{id:item.yt});
                const started=Date.now();
                while(Date.now()-started<9000){
                  status=await page.evaluate(()=>{
                    const overlay=document.getElementById('ph');
                    const text=(overlay?.innerText||'').trim();
                    if(overlay && !overlay.classList.contains('hide')){
                      if(text.includes('לא מאפשרים להטמיע')) return 'ERR:150';
                      if(text.includes('שגיאה 153')) return 'ERR:153';
                      if(text.includes('הוסר')||text.includes('פרטי')||text.includes('אינו זמין')) return 'ERR:100';
                      if(text.includes('YouTube לא הצליח')) return 'ERR:OTHER';
                    }
                    try{
                      if(ytPlayer && typeof ytPlayer.getPlayerState==='function'){
                        const st=ytPlayer.getPlayerState();
                        if([0,1,2,3,5].includes(st)) return 'OK:'+st;
                      }
                    }catch(e){}
                    return 'WAIT';
                  });
                  if(status!=='WAIT') break;
                  await page.waitForTimeout(400);
                }
              }catch(e){
                status='BROWSER:'+String(e).replace(/\s+/g,' ').slice(0,160);
              }
              results.push({kind:'youtube',...item,status});
              console.log(['CHECK_YT',item.ch,item.yt,status,item.title].join('\t'));
              if(status.startsWith('ERR:')||status==='TIMEOUT'||status.startsWith('BROWSER:')){
                bad.push({kind:'youtube',...item,status});
              }
            }
            await page.close();
          }

          let nextFrame=0;
          async function frameWorker(){
            const page=await browser.newPage();
            await page.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>typeof play==='function',null,{timeout:15000});
            while(true){
              const idx=nextFrame++;
              if(idx>=frameItems.length) break;
              const item=frameItems[idx];
              let status='FRAME_TIMEOUT';
              try{
                await page.evaluate(({embed})=>{
                  const x=DATA.items.find(y=>y.embed===embed);
                  if(!x) throw new Error('item missing');
                  play(x);
                },{embed:item.embed});
                await page.waitForTimeout(3500);
                const info=await page.evaluate(()=>({
                  src:document.querySelector('#playerHost iframe')?.src||'',
                  count:document.querySelectorAll('#playerHost iframe').length
                }));
                const childUrls=page.frames().map(f=>f.url());
                const wanted=new URL(item.embed);
                const loaded=childUrls.some(u=>{
                  try{
                    const z=new URL(u);
                    return z.hostname===wanted.hostname && z.href!=='about:blank';
                  }catch(e){return false}
                });
                status=(info.count===1 && info.src===item.embed && loaded)?'OK:FRAME':'ERR:FRAME';
              }catch(e){
                status='BROWSER:'+String(e).replace(/\s+/g,' ').slice(0,160);
              }
              results.push({kind:'iframe',...item,status});
              console.log(['CHECK_FRAME',item.ch,item.embed,status,item.title].join('\t'));
              if(status!=='OK:FRAME') bad.push({kind:'iframe',...item,status});
            }
            await page.close();
          }

          console.log('AUDIT_YT_COUNT='+ytItems.length);
          console.log('AUDIT_FRAME_COUNT='+frameItems.length);
          await Promise.all([
            ...Array.from({length:6},()=>ytWorker()),
            ...Array.from({length:2},()=>frameWorker())
          ]);
          await browser.close();

          console.log('\n=== BROKEN_EMBEDS ===');
          if(!bad.length) console.log('NONE');
          else for(const x of bad) console.log([x.kind,x.ch,x.title,x.yt||x.embed,x.status].join('\t'));
          console.log('BROKEN_COUNT='+bad.length);
          fs.writeFileSync('embed-audit-live.json',JSON.stringify({site:SITE,results,bad},null,2));
          if(bad.length) process.exit(2);
          JS
          node audit-live.mjs
