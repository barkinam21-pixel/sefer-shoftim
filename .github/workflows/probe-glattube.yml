name: Probe GlatTube HaNakh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-glattube.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser driver
        run: npm install --no-save playwright-core@latest
      - name: Inspect GlatTube Judges playlist in Chrome
        run: |
          cat > probe-glat.mjs <<'JS'
          import { chromium } from 'playwright-core';

          const ids=['dMfyog_Z5EA','oW0h-AwPhg4','KhbZVQ_xfPA','xJnDGKQvVCY','7WdCmDoBh1Q','DTN-sy0m7mg','oe3LNfZAzPw','lIms7HsGYQc','nKKjVOKhtLs','Wb7dZIf6kME','K0RVwNlTXpk','4QuUq6MTPFM','RUKgFr9tgzo','jUk9haofFbk','IhWO_NlxSkY','xVTOTk-pSJQ','0u4Dk9uy0Wg','bsLZc-RrKwE','LozAQ9gq91c','ofDCMQdoP8A','vme74pRb8j8'];
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const page=await browser.newPage({
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          });
          const responses=[];
          page.on('response', r=>{
            const u=r.url();
            if(/api|category|playlist|video/i.test(u)) responses.push({status:r.status(),url:u});
          });
          const res=await page.goto('https://glat.tube/category/13218',{waitUntil:'networkidle',timeout:60000});
          console.log('HTTP_STATUS',res?.status());
          console.log('TITLE',await page.title());
          console.log('URL',page.url());
          const text=(await page.locator('body').innerText()).slice(0,30000);
          console.log('HAS_JUDGES_PLAYLIST',text.includes('הנ"ך הבהיר - שופטים')||text.includes('הנ״ך הבהיר - שופטים'));
          console.log('BODY_HEAD',text.slice(0,5000).replace(/\n/g,' | '));

          const links=await page.locator('a').evaluateAll(as=>as.map(a=>({text:(a.innerText||'').trim(),href:a.href})));
          const interesting=links.filter(x=>
            /שופטים|הנ.?ך הבהיר/i.test(x.text) ||
            /\/video\//.test(x.href) ||
            ids.some(id=>x.href.includes(id))
          );
          console.log('INTERESTING_LINKS',JSON.stringify(interesting.slice(0,300),null,2));

          const html=await page.content();
          for(const id of ids) console.log('YTID',id,'FOUND',html.includes(id));

          console.log('NETWORK',JSON.stringify(responses.slice(-200),null,2));
          await browser.close();
          JS
          node probe-glat.mjs
