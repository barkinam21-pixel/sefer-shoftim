name: Query ShiurPod mirror for Nussbaum Judges
on:
  push:
    branches: [hanakh-crop-final]
    paths:
      - ".github/workflows/query-shiurpod-nussbaum.yml"
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect official YouTube metadata for source links
        run: |
          python3 - <<'PY'
          import requests,re,json,html
          ids=['dMfyog_Z5EA','xJnDGKQvVCY','4QuUq6MTPFM','vme74pRb8j8']
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36','Accept-Language':'he-IL,he;q=0.9,en;q=0.7'}
          for vid in ids:
            u='https://www.youtube.com/watch?v='+vid
            r=requests.get(u,headers=h,timeout=25)
            print('\n===',vid,'STATUS',r.status_code,'LEN',len(r.text),'===')
            # ytInitialPlayerResponse contains videoDetails.shortDescription
            m=re.search(r'ytInitialPlayerResponse\s*=\s*({.+?});(?:var |</script>)',r.text,re.S)
            obj=None
            if m:
              try: obj=json.loads(m.group(1))
              except Exception as e: print('JSONERR',e)
            if not obj:
              m=re.search(r'"videoDetails":(\{.+?\}),"playerConfig"',r.text,re.S)
              if m:
                try: obj={'videoDetails':json.loads(m.group(1))}
                except: pass
            vd=(obj or {}).get('videoDetails') or {}
            print('TITLE',vd.get('title'))
            print('DESC',vd.get('shortDescription','')[:12000])
            print('URLS',re.findall(r'https?://[^\s<>"\\]+',vd.get('shortDescription','')))
          PY
