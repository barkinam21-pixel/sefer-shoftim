name: One-off HaNakh cosmos method test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-hanakh-cosmos-production.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: npm install --no-save playwright-core@latest
      - name: Test direct youtube-nocookie embeds on production
        run: |
          cat > test.mjs <<'JS'
          import { chromium } from 'playwright-core';

          const URL='https://shoftim-v3.vercel.app/hanakh-cosmos-test.html';
          const browser=await chromium.launch({
            channel:'chrome',
            headless:true,
            args:['--autoplay-policy=no-user-gesture-required']
          });
          const page=await browser.newPage();

          let ready=false;
          for(let i=0;i<30;i++){
            await page.goto(URL+'?t='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            if(await page.locator('#fc').count()===1 && await page.locator('#f1').count()===1){ready=true;break}
            await page.waitForTimeout(3000);
          }
          if(!ready) throw new Error('Temporary production test page never became ready');

          await page.addScriptTag({url:'https://www.youtube.com/iframe_api'});
          await page.waitForFunction(()=>window.YT && typeof YT.Player==='function',null,{timeout:20000});

          async function test(id){
            return await page.evaluate(async (id)=>{
              return await new Promise(resolve=>{
                let finished=false;
                let player=null;
                const finish=(x)=>{if(!finished){finished=true;resolve(x)}};
                try{
                  player=new YT.Player(id,{
                    events:{
                      onReady:e=>{
                        try{e.target.mute();e.target.playVideo()}catch(_){}
                      },
                      onStateChange:e=>{
                        if(e.data===YT.PlayerState.PLAYING) finish({id,ok:true,state:e.data});
                      },
                      onError:e=>finish({id,ok:false,error:e.data})
                    }
                  });
                }catch(e){finish({id,ok:false,exception:String(e)});return}
                setTimeout(()=>{
                  let state=null;
                  try{state=player?.getPlayerState?.()}catch(_){}
                  finish({id,ok:state===YT.PlayerState.PLAYING,state,timeout:true});
                },12000);
              });
            },id);
          }

          const results=[];
          for(const id of ['f1','f2','f3','fc']){
            const r=await test(id);
            results.push(r);
            console.log('RESULT',JSON.stringify(r));
          }

          console.log('SUMMARY',JSON.stringify(results));
          const control=results.find(x=>x.id==='fc');
          if(!control?.ok) throw new Error('Cosmos control did not play; environment invalid');
          const hanakh=results.filter(x=>x.id!=='fc');
          if(hanakh.some(x=>!x.ok)) process.exit(2);
          JS
          node test.mjs
