name: Inspect GlatTube HaNakh
on:
  push:
    branches: [inspect-glattube-hanakh]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@latest
      - name: Inspect official GlatTube playlist and player
        run: |
          cat > inspect.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const page=await browser.newPage();
          await page.goto('https://glat.tube/category/13218',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(2500);
          const links=await page.locator('a').evaluateAll(as=>as.map(a=>({t:(a.innerText||a.textContent||'').trim(),h:a.href})));
          const norm=s=>(s||'').replace(/[״"']/g,'').replace(/\s+/g,' ').trim();
          const sub=links.find(x=>norm(x.t).includes('הנך הבהיר - שופטים')) || links.find(x=>norm(x.t).includes('הנך הבהיר')&&norm(x.t).includes('שופטים'));
          console.log('SUBCATEGORY='+JSON.stringify(sub));
          if(!sub?.h) throw new Error('Shoftim subcategory link not found');
          await page.goto(sub.h,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(2500);
          console.log('SUB_URL='+page.url());
          const sublinks=await page.locator('a').evaluateAll(as=>as.map(a=>({t:(a.innerText||a.textContent||'').trim().replace(/\s+/g,' '),h:a.href})));
          const vids=sublinks.filter(x=>x.h.includes('/video/'));
          console.log('VIDEO_COUNT='+vids.length);
          for(const v of vids.slice(0,80)) console.log('VIDEO_LINK='+JSON.stringify(v));
          if(vids[0]){
            await page.goto(vids[0].h,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(3000);
            console.log('FIRST_VIDEO_URL='+page.url());
            const media=await page.evaluate(()=>({
              iframes:[...document.querySelectorAll('iframe')].map(x=>x.src),
              videos:[...document.querySelectorAll('video')].map(x=>({src:x.src,currentSrc:x.currentSrc,poster:x.poster})),
              sources:[...document.querySelectorAll('source')].map(x=>x.src),
              scripts:[...document.scripts].map(x=>x.src).filter(Boolean).filter(x=>/player|video|youtube|vimeo/i.test(x)).slice(0,30)
            }));
            console.log('MEDIA='+JSON.stringify(media));
          }
          await browser.close();
          JS
          node inspect.mjs
