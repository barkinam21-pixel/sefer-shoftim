name: Inspect GlatTube HaNakh
on:
  push:
    branches: [inspect-glattube-hanakh]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@latest
      - name: Inspect official GlatTube category deeply
        run: |
          cat > inspect.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({channel:'chrome',headless:true});
          const page=await browser.newPage();
          await page.goto('https://glat.tube/category/13218',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(6000);
          console.log('TITLE='+await page.title());
          console.log('URL='+page.url());
          const body=(await page.locator('body').innerText()).replace(/\s+/g,' ');
          console.log('BODY_HAS_HANAKH='+/הנ.?ך הבהיר/.test(body));
          console.log('BODY_SNIP='+body.slice(0,8000));
          const links=await page.locator('a').evaluateAll(as=>as.map(a=>({t:(a.innerText||a.textContent||'').trim().replace(/\s+/g,' '),h:a.href})));
          console.log('LINK_COUNT='+links.length);
          for(const x of links.filter(x=>/הנ|שופטים|playlist|פלייליסט/i.test(x.t+' '+x.h)).slice(0,200)) console.log('MATCH_LINK='+JSON.stringify(x));
          console.log('HTML_HANAKH_SNIPS');
          const html=await page.content();
          const needle=['הנ&quot;ך הבהיר - שופטים','הנ"ך הבהיר - שופטים','שופטים'];
          for(const n of needle){let pos=html.indexOf(n); if(pos>=0) console.log('SNIP='+html.slice(Math.max(0,pos-1500),pos+3000).replace(/\s+/g,' '));}
          await browser.close();
          JS
          node inspect.mjs
