name: Test HaNakh cosmos embed method

on:
  push:
    branches: [test-hanakh-cosmos-embed]
    paths:
      - ".github/workflows/test-hanakh-cosmos-embed.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: npm install --no-save playwright-core@latest
      - name: Test three HaNakh HaBahir embeds
        run: |
          cat > test-hanakh.mjs <<'JS'
          import { chromium } from 'playwright-core';

          const url='https://shoftim-v3-qg6mp7wdt-barkinam21-5952s-projects.vercel.app/hanakh-cosmos-test.html';
          const browser=await chromium.launch({
            channel:'chrome',
            headless:true,
            args:['--autoplay-policy=no-user-gesture-required']
          });
          const page=await browser.newPage();
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(5000);

          const ids=['f1','f2','f3'];
          const results=[];
          for(const id of ids){
            const handle=await page.locator('#'+id).elementHandle();
            if(!handle){results.push({id,ok:false,reason:'iframe missing'});continue}
            const frame=await handle.contentFrame();
            if(!frame){results.push({id,ok:false,reason:'contentFrame unavailable'});continue}

            await frame.waitForTimeout(2500);
            let before='';
            try{before=(await frame.locator('body').innerText()).replace(/\s+/g,' ').slice(0,1200)}catch(e){}

            try{
              const play=frame.locator('.ytp-large-play-button');
              if(await play.count() && await play.first().isVisible()) await play.first().click({timeout:3000});
            }catch(e){}

            await frame.waitForTimeout(5000);

            const probe=await frame.evaluate(()=>{
              const body=(document.body?.innerText||'').replace(/\s+/g,' ').slice(0,2000);
              const err=(document.querySelector('.ytp-error-content-wrap,.ytp-error')?.textContent||'').replace(/\s+/g,' ').trim();
              const video=document.querySelector('video');
              return {
                body,
                err,
                hasVideo:!!video,
                paused:video?.paused ?? null,
                currentTime:video?.currentTime ?? null,
                readyState:video?.readyState ?? null,
                networkState:video?.networkState ?? null
              };
            }).catch(e=>({body:'',err:'PLAYWRIGHT_EVAL:'+String(e),hasVideo:false}));

            const badText=(probe.err+' '+probe.body).toLowerCase();
            const blocked=/video unavailable|playback on other websites has been disabled|not available|owner has disabled|error 150|error 101|לא ניתן|אינו זמין|לא מאפשר/.test(badText);
            const played=probe.hasVideo && ((probe.currentTime||0)>0 || (probe.readyState||0)>=2) && !blocked;
            const ok=played && !blocked;
            results.push({id,ok,before,probe});
            console.log('RESULT',id,JSON.stringify({ok,before,probe}));
          }

          await browser.close();
          const failed=results.filter(x=>!x.ok);
          console.log('SUMMARY',JSON.stringify(results));
          if(failed.length) process.exit(2);
          JS
          node test-hanakh.mjs
