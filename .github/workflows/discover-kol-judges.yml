name: Discover Kol Halashon Judges source IDs
on:
  push:
    branches: [hanakh-crop-final]
    paths:
      - ".github/workflows/discover-kol-judges.yml"
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Decode all outbound links in an official HaNakh description
        run: |
          python3 - <<'PY'
          import requests,re,html,urllib.parse,json
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36','Accept-Language':'he-IL,he;q=0.9,en;q=0.7'}
          for v in ['dMfyog_Z5EA','4QuUq6MTPFM','vme74pRb8j8']:
            t=requests.get('https://www.youtube.com/watch?v='+v,headers=H,timeout=25).text
            dec=html.unescape(t).replace('\\u0026','&').replace('\\/','/')
            print('\nVIDEO',v)
            outs=[]
            for m in re.finditer(r'https://www\.youtube\.com/redirect\?[^"\\]+',dec):
              x=m.group(0)
              qs=urllib.parse.parse_qs(urllib.parse.urlparse(x).query)
              q=qs.get('q',[''])[0]
              if q and q not in outs: outs.append(q)
            for q in outs: print('OUT',q)
            # direct description URL runs, including shortened display text
            for m in re.finditer(r'"url":"([^"]+)"',dec):
              x=m.group(1)
              if 'kolhalashon' in x.lower() and x not in outs: print('DIRECT',x)
          PY
