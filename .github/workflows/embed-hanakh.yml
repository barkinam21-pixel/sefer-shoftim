name: Embed HaNakh HaBahir
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch all 21 HaNakh HaBahir Judges chapters
        run: |
          python - -
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          ids={
            "א":"dMfyog_Z5EA","ב":"oW0h-AwPhg4","ג":"KhbZVQ_xfPA","ד":"xJnDGKQvVCY",
            "ה":"7WdCmDoBh1Q","ו":"DTN-sy0m7mg","ז":"oe3LNfZAzPw","ח":"lIms7HsGYQc",
            "ט":"nKKjVOKhtLs","י":"Wb7dZIf6kME","יא":"K0RVwNlTXpk","יב":"4QuUq6MTPFM",
            "יג":"RUKgFr9tgzo","יד":"jUk9haofFbk","טו":"IhWO_NlxSkY","טז":"xVTOTk-pSJQ",
            "יז":"0u4Dk9uy0Wg","יח":"bsLZc-RrKwE","יט":"LozAQ9gq91c","כ":"ofDCMQdoP8A","כא":"vme74pRb8j8"
          }
          for ch,vid in ids.items():
              title=f'הנ״ך הבהיר — שופטים פרק {ch}'
              pat=r'(\{"ch":"'+re.escape(ch)+r'","title":"'+re.escape(title)+r'","type":"base","yt":)(null|"[^"]*")(,"url":)(null|"[^"]*")(,"embed":null,"note":")([^"]*)("\})'
              m=re.search(pat,s)
              if not m:
                  raise SystemExit(f"Missing chapter {ch}")
              repl=m.group(1)+f'"{vid}"'+m.group(3)+'null'+m.group(5)+''+m.group(7)
              s=s[:m.start()]+repl+s[m.end():]
          s=s.replace('97 מתוך 126 פריטים ניתנים להפעלה בתוך האתר. כל 21/21 פרקי "הנ״ך הבהיר" נשארים גלויים ברצף הכרונולוגי גם כשאין להם ID הטמעה ישיר; 29 מקורות חיצוניים מסומנים במפורש.',
                      '116 מתוך 126 פריטים ניתנים להפעלה בתוך האתר. כל 21/21 פרקי "הנ״ך הבהיר" מוטמעים כעת ישירות בנגן; 10 מקורות חיצוניים מסומנים במפורש.')
          p.write_text(s,encoding="utf-8")
          PY
      - name: Verify
        run: |
          grep -q '"yt":"dMfyog_Z5EA"' index.html
          grep -q '"yt":"vme74pRb8j8"' index.html
          grep -q '116 מתוך 126' index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Embed all HaNakh HaBahir Judges chapters"
          git push
