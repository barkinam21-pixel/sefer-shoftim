<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>נגן קול הלשון — חיתוך מדויק</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:#070b12;color:#f7f9fc;font-family:Arial,sans-serif}
.wrap{max-width:920px;margin:auto;padding:14px}
h1{font-size:clamp(24px,5vw,34px);margin:10px 0 14px}
.note{background:#122034;border:1px solid #2d4563;border-radius:16px;padding:14px;line-height:1.5;margin-bottom:14px}

/* Mobile: true edge-to-edge crop.
   The Kol Halashon page has ~158px above its video on Bar's browser.
   We expose only the video-height slice and overscan the iframe slightly,
   so neither page-white nor side gutters can enter the visible window. */
.playerShell{
  position:relative;
  width:100vw;
  height:clamp(176px,26.5vw,216px);
  margin-inline:calc(50% - 50vw);
  overflow:hidden;
  background:#07111c;
  border:0;
  border-radius:0;
  box-shadow:0 14px 40px #0008;
}
.playerShell iframe{
  position:absolute;
  z-index:1;
  top:-158px;
  left:-6%;
  width:112%;
  height:900px;
  border:0;
  display:block;
  background:#07111c;
  transform:scale(1.03);
  transform-origin:top center;
}
/* safety crop: page chrome must never peek through at either vertical edge */
.playerShell::before,.playerShell::after{
  content:"";
  position:absolute;
  z-index:2;
  left:0;right:0;
  height:2px;
  background:#07111c;
  pointer-events:none;
}
.playerShell::before{top:0}
.playerShell::after{bottom:0}

.caption{margin-top:12px;color:#c5cfdd;font-size:14px;line-height:1.45}
.full{display:block;margin-top:14px;padding:15px;border-radius:14px;background:#fff;color:#111;text-decoration:none;text-align:center;font-weight:800}

@media(min-width:700px){
  .playerShell{
    width:calc(100% + 28px);
    margin-inline:-14px;
    height:230px;
    border-radius:18px;
  }
  .playerShell iframe{
    top:-150px;
    left:-4%;
    width:108%;
    transform:scale(1.02);
  }
}
</style>
</head>
<body><main class="wrap">
<h1>ניסוי — רק הווידאו של קול הלשון</h1>
<div class="note">כיוונתי מחדש לפי הצילום שלך: במובייל החלון עצמו מגיע ממש עד קצות המסך, והעמוד של קול הלשון מוגדל ונחתך כך שרק אזור הווידאו יכול להופיע — בלי לבן מלמעלה או מלמטה.</div>
<div class="playerShell">
<iframe
 src="https://www.kolhalashon.com/he/regularSite/playShiur/31472614/-1/0/false"
 title="קול הלשון — נגן וידאו"
 allow="autoplay; fullscreen; picture-in-picture"
 allowfullscreen
 referrerpolicy="strict-origin-when-cross-origin"
 scrolling="no"></iframe>
</div>
<div class="caption">זהו כיוונון edge-to-edge אמיתי, לא שינוי קטן של המסגרת הקודמת.</div>
<a class="full" href="https://www.kolhalashon.com/he/regularSite/playShiur/31472614/-1/0/false" target="_blank" rel="noopener">פתח במקור — גיבוי</a>
</main></body></html>
