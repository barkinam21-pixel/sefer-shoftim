/* V6.7 visual polish — additive only; core structure and data flow unchanged */
:root{
  --bg:#070b12;--card:#101722;--card2:#0c121c;--line:#233044;

}
html{scroll-behavior:smooth}
body{

    radial-gradient(700px 420px at 8% 0%,rgba(217,184,95,.07),transparent 58%),

}

.now{margin-top:10px}
.nowTitle{font-size:17px}.nowMeta{font-size:12px;margin-top:3px}

/* V6.7 UX polish — CSS-only, no data/player/architecture changes */
:root{
  color-scheme:dark;
  --surface-0:#070b12;
  --surface-1:#0c131e;
  --surface-2:#111a27;
  --surface-3:#162131;
  --stroke:#243247;
  --stroke-soft:rgba(255,255,255,.065);
  --text:#f7f9fc;
  --text-2:#b8c2d2;
  --brand:#e2c56f;
  --brand-soft:rgba(226,197,111,.12);
  --focus:#86b8ff;
}
body{overflow-x:hidden}
.wrap{width:min(100%,1180px);margin-inline:auto}
h1{max-width:900px}
.sub{max-width:900px}
.status{box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}

.playerBox{
  overflow:hidden;
  backdrop-filter:blur(16px) saturate(120%);
  -webkit-backdrop-filter:blur(16px) saturate(120%);
}
.player{background:#030507}
.now{
  padding:2px;
  border-radius:14px;
}
.nowText{min-width:0;padding-inline:4px}
.nowTitle{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.nowMeta{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#prev,#next,#open,.comfortBtn,.filter,.card{touch-action:manipulation}
#prev,#next,#open{
  min-height:50px;
  border-radius:12px;
}
#prev::before{content:"◀ ";font-size:.8em;opacity:.8}
#next::after{content:" ▶";font-size:.8em;opacity:.8}

.easybar{
  display:grid;

}
.comfortBtn,.jumpLabel{min-height:54px;border-radius:14px}
.comfortBtn{
  box-shadow:0 8px 24px rgba(226,197,111,.12);
}
.jumpLabel{min-width:0}
.chapterJump{min-width:0}

.toolbar{align-items:center}
.search{
  flex:1 1 100%;
  min-width:0;
  min-height:50px;
  border-radius:13px;

.card{
  min-width:0;

.card:hover{

.card>div:not(.noThumb){min-width:0}
.title{
  color:var(--text);

.thumb,.noThumb{

/* HaNakh HaBahir — approved Kol Halashon crop */
.player.kolMode{
  aspect-ratio:auto;
  height:clamp(176px,26.5vw,216px);
  max-height:none;
  overflow:hidden;
  background:#07111c;
}
.player.kolMode #playerHost{display:none}
.player.kolMode #hanakhPlayer{
  display:block!important;
  position:absolute;
  z-index:1;
  top:-158px;
  left:-6%;
  width:112%;
  height:900px;
  border:0;
  background:#07111c;
  transform:scale(1.03);
  transform-origin:top center;
}
.player.kolMode::before,.player.kolMode::after{
  content:"";
  position:absolute;
  z-index:3;
  left:0;
  right:0;
  height:2px;
  background:#07111c;
  pointer-events:none;
}
.player.kolMode::before{top:0}
.player.kolMode::after{bottom:0}
@media(max-width:699px){
  .playerBox.kolModeBox{overflow:visible}
  .player.kolMode{
    width:100vw;
    margin-inline:calc(50% - 50vw);
    border-radius:0;
    border-inline:0;
  }
}
@media(min-width:700px){
  .player.kolMode{height:230px;border-radius:18px}
  .player.kolMode #hanakhPlayer{
    top:-150px;
    left:-4%;
    width:108%;
    transform:scale(1.02);
  }
}

/* Kol Halashon native media — additive; approved cropped iframe remains fallback */
.kolNative{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain;z-index:1}

function makeYouTube(x){clearPlayer();const mount=document.createElement('div');mount.id='ytMount';host.appendChild(mount);ytPlayer=new YT.Player('ytMount',{videoId:x.yt,playerVars:{autoplay:1,playsinline:1,rel:0,origin:location.origin},events:{onReady:e=>{hideOverlay();try{e.target.playVideo()}catch(err){}},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)endedAdvance(x)},onError:e=>{const code=e.data;let msg='YouTube לא הצליח להפעיל את הסרטון בתוך האתר';if(code===153){msg='YouTube חסם את נגן ה-API בדפדפן הזה — אפשר לנסות מיד את הנגן הישיר החלופי';showOverlay(msg,x,'direct');return}else if(code===101||code===150)msg='היוצר או YouTube לא מאפשרים להטמיע את הסרטון הזה';else if(code===100)msg='הסרטון הוסר, הוגדר פרטי או אינו זמין';showOverlay(msg,x)},onAutoplayBlocked:()=>showOverlay('הדפדפן חסם הפעלה אוטומטית',x,'autoplay')}})}
function playDirectYouTube(x){clearPlayer();const o=encodeURIComponent(location.origin);const wr=encodeURIComponent(location.href);hanakhFrame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(x.yt)+'?autoplay=1&playsinline=1&rel=0&modestbranding=1&origin='+o+'&widget_referrer='+wr;hanakhFrame.style.display='block';hideOverlay()}
function playKolFallback(x){clearPlayer();if(activeItem!==x)return;if(playerEl)playerEl.classList.add('kolMode');if(playerBox)playerBox.classList.add('kolModeBox');hanakhFrame.src=sourceUrl(x);hanakhFrame.style.display='block';hideOverlay()}
function playKol(x){clearPlayer();if(activeItem!==x)return;if(playerEl)playerEl.classList.add('kolNativeMode');kolNative.style.display='block';kolNative.onended=()=>endedAdvance(x);kolNative.onerror=()=>{if(activeItem===x)playKolFallback(x)};kolNative.oncanplay=()=>{if(activeItem===x)hideOverlay()};kolNative.src='/api/kol?id='+encodeURIComponent(x.kol)+'&type=2';try{kolNative.load()}catch(e){}const p=kolNative.play();if(p&&typeof p.catch==='function')p.catch(()=>{if(activeItem===x)showOverlay('הדפדפן חסם הפעלה אוטומטית',x,'kol-autoplay')})}
function loadYouTube(x){if(window.YT&&YT.Player){makeYouTube(x)}else{pendingYT=x;showOverlay('טוען את נגן YouTube…',null)}}
window.onYouTubeIframeAPIReady=()=>{if(pendingYT){const x=pendingYT;pendingYT=null;makeYouTube(x)}};
(function(){if(document.querySelector('script[data-yt-api]'))return;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.referrerPolicy='strict-origin-when-cross-origin';s.dataset.ytApi='1';document.head.appendChild(s)})();
function play(x){if(!x.yt&&!x.embed&&!x.kol){window.open(x.url,'_blank','noopener');return}current=playables.findIndex(y=>y===x);activeItem=x;try{localStorage.setItem('shoftim-last-title',x.title)}catch(e){};nt.textContent=x.title;nm.textContent=DATA.typeNames[x.type]+' • '+(x.note||'');ob.href=sourceUrl(x);if(x.kol)playKol(x);else if(x.yt){if(x.directYT)playDirectYouTube(x);else loadYouTube(x)}else{clearPlayer();const iframe=document.createElement('iframe');iframe.src=x.embed;iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';host.appendChild(iframe);hideOverlay()}window.scrollTo({top:0,behavior:'smooth'})}
function step(d){if(!playables.length)return;current=(current+d+playables.length)%playables.length;play(playables[current])}document.getElementById('next').onclick=()=>step(1);document.getElementById('prev').onclick=()=>step(-1);
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const root=document.getElementById('timeline');root.innerHTML='';for(const [label,key] of DATA.chapters){const arr=DATA.items.filter(x=>x.ch===key&&(filter==='all'||filter==='playable'&&(x.yt||x.embed||x.kol)||filter==='external'&&(!x.yt&&!x.embed&&!x.kol)||x.type===filter)&&(!q||(x.title+' '+(x.note||'')+' '+DATA.typeNames[x.type]).toLowerCase().includes(q)));if(!arr.length)continue;const s=document.createElement('section');s.className='chapter';s.dataset.chapter=key;s.innerHTML='<div class="chHead">'+label+'</div><div class="cards"></div>';const c=s.querySelector('.cards');for(const x of arr){const a=document.createElement('a');a.className='card';a.href=x.yt||x.embed||x.kol?'#':(x.url||'#');if(!x.yt&&!x.embed&&!x.kol){a.target='_blank';a.rel='noopener'}const thumbId=x.yt||x.thumbYT;const media=thumbId?'<img class="thumb" loading="lazy" alt="" src="https://i.ytimg.com/vi/'+thumbId+'/hqdefault.jpg">':'<div class="noThumb">'+(x.embed||x.kol?'▶️':x.type==='bac'?'🏛️':x.type==='arch'?'🏺':x.type==='field'?'🗺️':'📖')+'</div>';const av=x.kol?'<span class="avail in">▶ הנ״ך הבהיר — בתוך האתר</span>':(x.yt||x.embed?'<span class="avail in">▶ בתוך האתר</span>':(x.type==='base'?'<span class="avail out">↗ הנ״ך הבהיר — פתיחה במקור</span>':'<span class="avail out">↗ מקור חיצוני</span>'));a.innerHTML=media+'<div><div class="title">'+x.title+'</div><div class="note">'+(x.note||'')+'</div><span class="chip '+x.type+'">'+DATA.typeNames[x.type]+'</span>'+av+'</div>';if(x.yt||x.embed||x.kol)a.onclick=e=>{e.preventDefault();play(x)};c.appendChild(a)}root.appendChild(s)}}const chapterJump=document.getElementById('chapterJump');
for(const [label,key] of DATA.chapters){const o=document.createElement('option');o.value=key;o.textContent=label;chapterJump.appendChild(o)}
chapterJump.onchange=()=>{const el=document.querySelector('[data-chapter="'+CSS.escape(chapterJump.value)+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})};
document.getElementById('resumeBtn').onclick=()=>{let t='';try{t=localStorage.getItem('shoftim-last-title')||''}catch(e){}const x=DATA.items.find(i=>i.title===t);if(x&&(x.yt||x.embed||x.kol))play(x);else{const first=playables[0];if(first)play(first)}};
document.getElementById('search').oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});render();
</script></body></html><!-- vercel-autodeploy-test -->
