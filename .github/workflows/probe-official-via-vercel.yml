name: Probe official sources via Vercel
on:
  push:
    branches: [hanakh-retest-official]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect previous READY preview endpoint
        run: |
          set +e
          U=https://shoftim-v3-nlniamm5e-barkinam21-5952s-projects.vercel.app/api/inspect-official
          echo "URL=$U"
          curl -sS -D /tmp/h -o /tmp/b "$U"
          echo "---- HEADERS ----"
          cat /tmp/h
          echo "---- BODY ----"
          head -c 30000 /tmp/b
          echo
          echo "---- END ----"
