name: Audit all video embeds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: |
          google-chrome --version
          npm install --no-save playwright-core@latest
      - name: Test every YouTube embed in a real browser
        run: |
          cat > audit-embeds.mjs <<'JS'
          import fs from 'fs';
          import http from 'http';
          import { chromium } from 'playwright-core';

          const html = fs.readFileSync('index.html','utf8');
          const m = html.match(/const DATA=(\{.*?\});let filter=/s);
          if (!m) throw new Error('DATA not found');
          const data = JSON.parse(m[1]);
          const items = data.items.filter(x => x.yt);

          const testPage = `<!doctype html>
          <meta charset="utf-8">
          <title>WAIT</title>
          <div id="p"></div>
          <script src="https://www.youtube.com/iframe_api"><\/script>
          <script>
          const id=new URLSearchParams(location.search).get('v');
          let done=false;
          const finish=(s)=>{if(!done){done=true;document.title=s}};
          window.onYouTubeIframeAPIReady=()=>{
            const p=new YT.Player('p',{
              width:'640',height:'360',videoId:id,
              playerVars:{autoplay:1,playsinline:1,rel:0,origin:location.origin},
              events:{
                onReady:e=>{
                  try{e.target.mute();e.target.playVideo()}catch(_){}
                  setTimeout(()=>{
                    if(done)return;
                    let st=-99;
                    try{st=e.target.getPlayerState()}catch(_){}
                    if([-1,0,1,2,3,5].includes(st)) finish('OK:'+st);
                    else finish('UNKNOWN:'+st);
                  },5000);
                },
                onStateChange:e=>{
                  if([0,1,2,3,5].includes(e.data)) finish('OK:'+e.data);
                },
                onError:e=>finish('ERR:'+e.data)
              }
            });
          };
          setTimeout(()=>finish('TIMEOUT'),12000);
          <\/script>`;

          const server=http.createServer((req,res)=>{
            res.writeHead(200,{'content-type':'text/html; charset=utf-8'});
            res.end(testPage);
          });
          await new Promise(r=>server.listen(4173,'127.0.0.1',r));

          const browser=await chromium.launch({channel:'chrome',headless:true,args:['--autoplay-policy=no-user-gesture-required']});
          let next=0;
          const bad=[];
          const results=[];

          async function worker(n){
            const page=await browser.newPage();
            while(true){
              const idx=next++;
              if(idx>=items.length)break;
              const x=items[idx];
              try{
                await page.goto('http://127.0.0.1:4173/?v='+encodeURIComponent(x.yt),{waitUntil:'domcontentloaded',timeout:20000});
                await page.waitForFunction(()=>/^(OK|ERR|TIMEOUT|UNKNOWN):?/.test(document.title),null,{timeout:15000});
                const status=await page.title();
                results.push({idx,chapter:x.ch,title:x.title,id:x.yt,status});
                console.log('CHECK\t'+(idx+1)+'\t'+x.ch+'\t'+x.yt+'\t'+status+'\t'+x.title);
                if(status.startsWith('ERR:')||status==='TIMEOUT'||status.startsWith('UNKNOWN:')){
                  bad.push({idx,chapter:x.ch,title:x.title,id:x.yt,status});
                }
              }catch(e){
                const status='BROWSER:'+String(e).replace(/\s+/g,' ').slice(0,180);
                results.push({idx,chapter:x.ch,title:x.title,id:x.yt,status});
                bad.push({idx,chapter:x.ch,title:x.title,id:x.yt,status});
                console.log('CHECK\t'+(idx+1)+'\t'+x.ch+'\t'+x.yt+'\t'+status+'\t'+x.title);
              }
            }
            await page.close();
          }

          console.log('AUDIT_COUNT='+items.length);
          await Promise.all(Array.from({length:8},(_,i)=>worker(i)));
          await browser.close();
          server.close();

          results.sort((a,b)=>a.idx-b.idx);
          bad.sort((a,b)=>a.idx-b.idx);
          console.log('\n=== BROKEN_MARKED_EMBEDS ===');
          if(!bad.length) console.log('NONE');
          else for(const x of bad) console.log([x.idx+1,x.chapter,x.title,x.id,x.status].join('\t'));
          console.log('BROKEN_COUNT='+bad.length);
          fs.writeFileSync('embed-audit.json',JSON.stringify({results,bad},null,2));
          if(bad.length) process.exit(2);
          JS
          node audit-embeds.mjs
