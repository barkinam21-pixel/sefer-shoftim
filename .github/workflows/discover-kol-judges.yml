name: Discover Kol Halashon Judges source IDs
on:
  push:
    branches: [hanakh-crop-final]
    paths:
      - ".github/workflows/discover-kol-judges.yml"
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search indexed official lesson URLs
        run: |
          python3 - <<'PY'
          import requests,re,html,urllib.parse,time
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36'}
          chapters=['א','ב','ג','ד','ה','ו','ז','ח','ט','י','יא','יב','יג','יד','טו','טז','יז','יח','יט','כ','כא']
          for ch in chapters:
            q=f'"פרק {ch}, שופטים" "רפאל נוסבוים"'
            u='https://www.google.com/search?num=20&q='+urllib.parse.quote(q)
            try:
              r=requests.get(u,headers=H,timeout=20)
              print('\nCHAPTER',ch,'STATUS',r.status_code,'LEN',len(r.text))
              links=[]
              for m in re.finditer(r'https?://[^"&<> ]+',html.unescape(r.text)):
                x=m.group(0)
                if 'kolhalashon.com' in x or 'glat.tube' in x:
                  x=x.split('&')[0]
                  if x not in links: links.append(x)
              for x in links[:20]: print('RESULT',x)
              # also print snippets around exact title
              plain=re.sub(r'<[^>]+>',' ',r.text)
              plain=html.unescape(re.sub(r'\s+',' ',plain))
              for key in [f'פרק {ch}, שופטים','נוסבוים','kolhalashon']:
                pos=plain.find(key)
                if pos>=0: print('SNIP',plain[max(0,pos-250):pos+900])
              time.sleep(.5)
            except Exception as e: print('ERR',ch,repr(e))
          PY
