name: HaNakh Crop Preview Pages

on:
  push:
    branches: [hanakh-crop-final]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hanakh-crop-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare preview site
        run: |
          mkdir -p _site
          cp kol-player-crop.html _site/index.html
          cp kol-player-crop.html _site/kol-player-crop.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
