name: Import V6.2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current V6.2
        run: |
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://astounding-dodol-a90e9c.netlify.app/" -o index.html
          grep -q "97 מתוך 126" index.html
          grep -q "ספר שופטים" index.html
      - name: Commit V6.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import Book of Judges V6.2"
            git push
          fi
