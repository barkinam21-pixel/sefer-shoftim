name: Guard HaNakh HaBahir direct embeds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 21 chapters use the cosmos direct-iframe path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          s = Path("index.html").read_text(encoding="utf-8")
          a = s.index("const DATA=") + len("const DATA=")
          b = s.index(";let filter=", a)
          data = json.loads(s[a:b])

          items = [
              x for x in data["items"]
              if x.get("title", "").startswith("הנ״ך הבהיר — שופטים פרק ")
          ]

          errors = []
          if len(items) != 21:
              errors.append(f"Expected 21 HaNakh chapters, found {len(items)}")

          for x in items:
              if not x.get("yt"):
                  errors.append(f'{x["title"]}: missing YouTube id')
              if not x.get("directYT"):
                  errors.append(f'{x["title"]}: not routed through directYT cosmos method')
              url = x.get("url") or ""
              if not url.startswith("https://www.youtube.com/watch?v="):
                  errors.append(f'{x["title"]}: missing YouTube fallback URL')

          required = [
              "https://www.youtube-nocookie.com/embed/",
              "widget_referrer=",
              "referrerPolicy='strict-origin-when-cross-origin'"
          ]
          for token in required:
              if token not in s:
                  errors.append(f"Missing direct iframe requirement: {token}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("All 21 HaNakh HaBahir chapters are routed through the direct privacy-enhanced iframe method with fallback.")
          PY
