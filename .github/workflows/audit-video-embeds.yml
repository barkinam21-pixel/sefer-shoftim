name: Audit all video embeds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: |
          google-chrome --version
          npm install --no-save playwright-core@latest
      - name: Test every embed on the live production site
        run: |
          cat > audit-live.mjs <<'JS'
          import fs from 'fs';
          import { chromium } from 'playwright-core';

          const SITE='https://shoftim-v3.vercel.app/';
          const browser=await chromium.launch({
            channel:'chrome',
            headless:true,
            args:['--autoplay-policy=no-user-gesture-required']
          });

          const seed=await browser.newPage();
          await seed.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
          await seed.waitForFunction(()=>typeof DATA!=='undefined' && Array.isArray(DATA.items),null,{timeout:15000});
          const items=await seed.evaluate(()=>DATA.items.filter(x=>x.yt).map(x=>({
            ch:x.ch,title:x.title,id:x.yt
          })));
          await seed.close();

          let next=0;
          const results=[];
          const bad=[];

          async function worker(){
            const page=await browser.newPage();
            await page.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.YT && YT.Player && typeof play==='function',null,{timeout:20000});
            while(true){
              const idx=next++;
              if(idx>=items.length) break;
              const item=items[idx];
              try{
                await page.evaluate(({id})=>{
                  const x=DATA.items.find(y=>y.yt===id);
                  if(!x) throw new Error('item missing');
                  play(x);
                },{id:item.id});

                let status='TIMEOUT';
                const started=Date.now();
                while(Date.now()-started<9000){
                  status=await page.evaluate(()=>{
                    const overlay=document.getElementById('ph');
                    const text=(overlay?.innerText||'').trim();
                    if(overlay && !overlay.classList.contains('hide')){
                      if(text.includes('לא מאפשרים להטמיע')) return 'ERR:150';
                      if(text.includes('שגיאה 153')) return 'ERR:153';
                      if(text.includes('הוסר')||text.includes('פרטי')||text.includes('אינו זמין')) return 'ERR:100';
                      if(text.includes('YouTube לא הצליח')) return 'ERR:OTHER';
                    }
                    try{
                      if(ytPlayer && typeof ytPlayer.getPlayerState==='function'){
                        const st=ytPlayer.getPlayerState();
                        if([0,1,2,3,5].includes(st)) return 'OK:'+st;
                      }
                    }catch(e){}
                    return 'WAIT';
                  });
                  if(status!=='WAIT') break;
                  await page.waitForTimeout(400);
                }
                results.push({...item,idx,status});
                console.log(['CHECK',idx+1,item.ch,item.id,status,item.title].join('\t'));
                if(status.startsWith('ERR:')||status==='TIMEOUT') bad.push({...item,idx,status});
              }catch(e){
                const status='BROWSER:'+String(e).replace(/\s+/g,' ').slice(0,160);
                results.push({...item,idx,status});
                bad.push({...item,idx,status});
                console.log(['CHECK',idx+1,item.ch,item.id,status,item.title].join('\t'));
              }
            }
            await page.close();
          }

          console.log('AUDIT_COUNT='+items.length);
          await Promise.all(Array.from({length:8},()=>worker()));
          await browser.close();

          results.sort((a,b)=>a.idx-b.idx);
          bad.sort((a,b)=>a.idx-b.idx);
          console.log('\n=== BROKEN_MARKED_EMBEDS ===');
          if(!bad.length) console.log('NONE');
          else for(const x of bad) console.log([x.idx+1,x.ch,x.title,x.id,x.status].join('\t'));
          console.log('BROKEN_COUNT='+bad.length);
          fs.writeFileSync('embed-audit-live.json',JSON.stringify({site:SITE,results,bad},null,2));
          if(bad.length) process.exit(2);
          JS
          node audit-live.mjs
