name: Audit video embeds safely

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@latest
      - name: Audit provider frames and sanity-check YouTube environment
        run: |
          cat > audit-live.mjs <<'JS'
          import fs from 'fs';
          import { chromium } from 'playwright-core';

          const SITE='https://shoftim-v3.vercel.app/';
          const localHtml=fs.readFileSync('index.html','utf8');
          const m=localHtml.match(/const DATA=(\{.*?\});let filter=/s);
          if(!m) throw new Error('Local DATA not found');
          const expected=JSON.parse(m[1]);
          const exp={
            total:expected.items.length,
            yt:expected.items.filter(x=>x.yt).length,
            embed:expected.items.filter(x=>x.embed).length
          };

          const browser=await chromium.launch({
            channel:'chrome',headless:true,
            args:['--autoplay-policy=no-user-gesture-required']
          });

          // Wait for canonical Vercel production to match this commit's data.
          const seed=await browser.newPage();
          let matched=false;
          for(let n=0;n<30;n++){
            await seed.goto(SITE+'?audit='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            try{
              const live=await seed.evaluate(()=>({
                total:DATA.items.length,
                yt:DATA.items.filter(x=>x.yt).length,
                embed:DATA.items.filter(x=>x.embed).length
              }));
              console.log('LIVE_VERSION',JSON.stringify(live),'EXPECTED',JSON.stringify(exp));
              if(live.total===exp.total && live.yt===exp.yt && live.embed===exp.embed){
                matched=true; break;
              }
            }catch(e){}
            await seed.waitForTimeout(3000);
          }
          if(!matched) throw new Error('Live production never matched this commit');

          const items=await seed.evaluate(()=>DATA.items.map(x=>({
            ch:x.ch,title:x.title,yt:x.yt||null,embed:x.embed||null
          })));
          await seed.close();

          // GitHub-hosted Chrome can itself receive YouTube error 150 even for
          // YouTube's official IFrame API sample. Test the control first.
          // If the control fails, YouTube results are INCONCLUSIVE and must
          // never be used to remove/disable site videos.
          async function youtubeControl(){
            const page=await browser.newPage();
            await page.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.YT&&YT.Player,null,{timeout:20000});
            const status=await page.evaluate(()=>new Promise(resolve=>{
              const mount=document.createElement('div');
              mount.id='ytControlMount';
              document.body.appendChild(mount);
              let done=false;
              const finish=s=>{if(!done){done=true;resolve(s)}};
              const p=new YT.Player('ytControlMount',{
                videoId:'M7lc1UVf-VE',
                playerVars:{autoplay:1,playsinline:1,origin:location.origin},
                events:{
                  onReady:e=>{try{e.target.mute();e.target.playVideo()}catch(_){}},
                  onStateChange:e=>{if(e.data===1)finish('OK:PLAYING')},
                  onError:e=>finish('ERR:'+e.data)
                }
              });
              setTimeout(()=>finish('TIMEOUT'),10000);
            }));
            await page.close();
            return status;
          }
          const control=await youtubeControl();
          console.log('YOUTUBE_CONTROL='+control);
          if(control!=='OK:PLAYING'){
            console.log('YOUTUBE_AUDIT=INCONCLUSIVE_ENVIRONMENT_BLOCKED');
            console.log('IMPORTANT: do not remove or downgrade YouTube items from this runner result.');
          }else{
            console.log('YOUTUBE_AUDIT=AVAILABLE');
          }

          const frameItems=items.filter(x=>x.embed);
          const bad=[];
          let next=0;
          async function frameWorker(){
            const page=await browser.newPage();
            await page.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>typeof play==='function',null,{timeout:15000});
            while(true){
              const idx=next++;
              if(idx>=frameItems.length) break;
              const item=frameItems[idx];
              let status='ERR:FRAME';
              try{
                await page.evaluate(({embed})=>{
                  const x=DATA.items.find(y=>y.embed===embed);
                  if(!x) throw new Error('item missing');
                  play(x);
                },{embed:item.embed});
                await page.waitForTimeout(3500);
                const info=await page.evaluate(()=>({
                  src:document.querySelector('#playerHost iframe')?.src||'',
                  count:document.querySelectorAll('#playerHost iframe').length
                }));
                const wanted=new URL(item.embed);
                const loaded=page.frames().some(f=>{
                  try{
                    const z=new URL(f.url());
                    return z.hostname===wanted.hostname && z.href!=='about:blank';
                  }catch(e){return false}
                });
                status=(info.count===1 && info.src===item.embed && loaded)?'OK:FRAME':'ERR:FRAME';
              }catch(e){
                status='BROWSER:'+String(e).replace(/\s+/g,' ').slice(0,160);
              }
              console.log(['CHECK_FRAME',item.ch,item.embed,status,item.title].join('\t'));
              if(status!=='OK:FRAME') bad.push({...item,status});
            }
            await page.close();
          }

          console.log('YOUTUBE_ITEMS_PRESENT='+items.filter(x=>x.yt).length);
          console.log('AUDIT_FRAME_COUNT='+frameItems.length);
          await Promise.all(Array.from({length:Math.min(4,Math.max(1,frameItems.length))},()=>frameWorker()));

          // Deep provider diagnostics: distinguish a real provider privacy
          // rejection from runner-specific security/autoplay restrictions.
          const deepPage=await browser.newPage();
          await deepPage.goto(SITE,{waitUntil:'domcontentloaded',timeout:30000});
          await deepPage.waitForFunction(()=>typeof play==='function',null,{timeout:15000});
          for(const item of frameItems){
            try{
              await deepPage.evaluate(({embed})=>{
                const x=DATA.items.find(y=>y.embed===embed);
                if(x) play(x);
              },{embed:item.embed});
              await deepPage.waitForTimeout(1500);
              const wanted=new URL(item.embed);
              const fr=deepPage.frames().find(f=>{
                try{return new URL(f.url()).hostname===wanted.hostname}catch{return false}
              });
              let detail={frame:false};
              if(fr){
                detail=await fr.evaluate(()=>({
                  frame:true,
                  title:document.title||'',
                  text:(document.body?.innerText||'').replace(/\s+/g,' ').slice(0,300),
                  videoCount:document.querySelectorAll('video').length,
                  audioCount:document.querySelectorAll('audio').length,
                  media:Array.from(document.querySelectorAll('video,audio')).slice(0,2).map(m=>({
                    readyState:m.readyState,networkState:m.networkState,duration:Number.isFinite(m.duration)?m.duration:null,
                    paused:m.paused,ended:m.ended,error:m.error?{code:m.error.code,message:m.error.message||''}:null
                  }))
                }));
              }
              console.log('DEEP_FRAME\t'+item.ch+'\t'+item.title+'\t'+JSON.stringify(detail));
              const providerPrivacy=detail.frame && /because of its privacy settings[^.]*cannot be played here|privacy settings, this video cannot be played here/i.test(detail.text||'');
              if(providerPrivacy) bad.push({...item,status:'ERR:PROVIDER_PRIVACY'});
            }catch(e){
              console.log('DEEP_FRAME_ERR\t'+item.ch+'\t'+item.title+'\t'+String(e).replace(/\s+/g,' ').slice(0,220));
            }
          }

          // Validate every HaNakh chapter against the same official Kol Halashon
          // signed-media route used by production. Each probe requests only one
          // byte, so it verifies availability without downloading the videos.
          const kolItems=expected.items.filter(x=>x.kol);
          const kolProbeBad=[];
          for(const x of kolItems){
            try{
              const r=await fetch(SITE+'api/kol?id='+encodeURIComponent(x.kol)+'&type=2&directprobe=1',{redirect:'follow'});
              const j=await r.json();
              const ok=r.ok && j.ok===true && /^video\/mp4/i.test(j.contentType||'') && (j.status===200||j.status===206);
              console.log('KOL_PROBE\t'+x.ch+'\t'+x.kol+'\t'+(ok?'OK':'ERR')+'\t'+JSON.stringify(j));
              if(!ok)kolProbeBad.push({ch:x.ch,title:x.title,embed:'kol:'+x.kol,status:'ERR:KOL_MEDIA'});
            }catch(e){
              kolProbeBad.push({ch:x.ch,title:x.title,embed:'kol:'+x.kol,status:'ERR:KOL_PROBE '+String(e).slice(0,120)});
            }
          }
          bad.push(...kolProbeBad);

          // End-to-end auto-next: play the first HaNakh item through the actual
          // native <video>, seek it to the last moment, and require activeItem
          // to advance. This proves we react to a real HTMLMediaElement ended
          // event rather than a guessed timer.
          try{
            const before=await deepPage.evaluate(()=>{
              const x=DATA.items.find(y=>y.kol);
              if(!x)throw new Error('no Kol item');
              play(x);
              const v=document.getElementById('kolNative');
              if(v)v.muted=true;
              return {title:x.title,index:current};
            });
            await deepPage.waitForFunction(()=>{
              const v=document.getElementById('kolNative');
              return !!v && v.readyState>=1 && Number.isFinite(v.duration) && v.duration>2;
            },null,{timeout:30000});
            const media=await deepPage.evaluate(async()=>{
              const v=document.getElementById('kolNative');
              v.muted=true;
              v.currentTime=Math.max(0,v.duration-0.7);
              try{await v.play()}catch(e){}
              return {duration:v.duration,currentTime:v.currentTime,currentSrc:v.currentSrc||v.src};
            });
            await deepPage.waitForFunction(({title,index})=>activeItem&&activeItem.title!==title&&current!==index,before,{timeout:12000});
            const after=await deepPage.evaluate(()=>({title:activeItem?.title||'',index:current,now:document.getElementById('nowTitle')?.textContent||''}));
            console.log('KOL_AUTO_NEXT=OK\t'+JSON.stringify({before,media,after}));
          }catch(e){
            const state=await deepPage.evaluate(()=>({title:activeItem?.title||'',index:current,ready:document.getElementById('kolNative')?.readyState||0,duration:document.getElementById('kolNative')?.duration||null,currentTime:document.getElementById('kolNative')?.currentTime||0})).catch(()=>({}));
            console.log('KOL_AUTO_NEXT=ERR\t'+String(e).replace(/\s+/g,' ').slice(0,240)+'\t'+JSON.stringify(state));
            bad.push({ch:'הנ״ך',title:'HaNakh native auto-next',embed:'/api/kol',status:'ERR:KOL_AUTO_NEXT'});
          }
          await deepPage.close();
          await browser.close();

          console.log('\n=== BROKEN_PROVIDER_EMBEDS ===');
          if(!bad.length) console.log('NONE');
          else bad.forEach(x=>console.log([x.ch,x.title,x.embed,x.status].join('\t')));
          console.log('BROKEN_COUNT='+bad.length);
          if(bad.length) process.exit(2);
          JS
          node audit-live.mjs
