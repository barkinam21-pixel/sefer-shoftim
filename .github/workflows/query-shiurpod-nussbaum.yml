name: Query ShiurPod mirror for Nussbaum Judges
on:
  push:
    branches: [hanakh-crop-final]
    paths:
      - ".github/workflows/query-shiurpod-nussbaum.yml"
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Resolve Nussbaum feed from known Joshua ID
        run: |
          python3 - <<'PY'
          import requests,re,json
          H={'User-Agent':'Mozilla/5.0'}
          base='https://shiurpod.com'
          for q in ['יהושע פרק טו','יהושע פרק 15','Joshua Chapter 15','פרק טו יהושע']:
            r=requests.get(base+'/api/episodes/search',params={'q':q,'limit':'100'},headers=H,timeout=25)
            data=r.json() if r.ok else []
            print('\nQUERY',q,'STATUS',r.status_code,'COUNT',len(data) if isinstance(data,list) else '?')
            if isinstance(data,list):
              for x in data:
                au=x.get('audioUrl') or ''
                if '31472614' in au or re.search(r'נוסב|nuss|nusbaum',json.dumps(x,ensure_ascii=False),re.I):
                  print('MATCH',json.dumps(x,ensure_ascii=False))
                  fid=x.get('feedId')
                  if fid:
                    fr=requests.get(base+f'/api/feeds/{fid}',headers=H,timeout=25)
                    print('FEED',fr.status_code,fr.text[:5000])
                    er=requests.get(base+f'/api/feeds/{fid}/episodes',params={'limit':'100','page':'1','sort':'oldest','slim':'1'},headers=H,timeout=25)
                    print('EPISODES_PAGE1',er.status_code,er.text[:40000])
          PY
