<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ניסוי נגן נקי — קול הלשון HLS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b12;color:#f7f9fc;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:14px}
h1{font-size:clamp(24px,5vw,34px);margin:10px 0 14px}
.note,.status{border-radius:16px;padding:14px;line-height:1.5;margin:12px 0;border:1px solid #2d4563;background:#122034}
.status{background:#101722}
.status.ok{border-color:#2b8059;background:#10231c}
.status.bad{border-color:#91474d;background:#2b1518}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;border:1px solid #26364d}
video{display:block;width:100%;height:100%;background:#000;object-fit:contain}
a{display:block;padding:15px;border-radius:14px;background:#fff;color:#111;text-align:center;text-decoration:none;font-weight:800;margin-top:14px}
small{color:#bcc6d6}
</style>
</head>
<body><main class="wrap">
<h1>נגן נקי — הווידאו עצמו בלבד</h1>
<div class="note">זה לא iframe של דף קול הלשון. הנגן פונה לסטרים הווידאו הרשמי של קול הלשון, ולכן אם הוא עובד — באתר שופטים יופיע רק הסרטון והפקדים.</div>
<div class="player"><video id="v" controls playsinline preload="metadata"></video></div>
<div id="st" class="status">בודק את הסטרים הרשמי…</div>
<a href="https://www.kolhalashon.com/he/regularSite/playShiur/31472614/-1/0/false" target="_blank" rel="noopener">פתח במקור — גיבוי</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
<script>
const id='31472614';
const prefix=id.slice(0,5);
const url='https://media2.kolhalashon.com:9001/KHL_Video/_definst_/amlst:NewArchive/HD/'+prefix+'/'+id+'/playlist.m3u8';
const v=document.getElementById('v'), st=document.getElementById('st');
function ok(t){st.className='status ok';st.innerHTML='✅ '+t}
function bad(t){st.className='status bad';st.innerHTML='❌ '+t}
v.addEventListener('loadedmetadata',()=>ok('הסטרים נטען. לחץ Play — זה הווידאו המקורי בלבד.'));
v.addEventListener('playing',()=>ok('מנגן בפועל — מצאנו נגן נקי.'));
v.addEventListener('error',()=>bad('תגית הווידאו דיווחה על שגיאה. קוד: '+(v.error?.code||'?')));
if(v.canPlayType('application/vnd.apple.mpegurl')){
  v.src=url;
}else if(window.Hls&&Hls.isSupported()){
  const h=new Hls({enableWorker:true,lowLatencyMode:false});
  h.loadSource(url);h.attachMedia(v);
  h.on(Hls.Events.MANIFEST_PARSED,()=>ok('Manifest HLS נטען — לחץ Play.'));
  h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)bad('HLS: '+d.type+' / '+d.details)});
}else{
  bad('הדפדפן לא תומך HLS/MSE.');
}
</script>
</body></html>
