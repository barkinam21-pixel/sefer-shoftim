name: Validate and stage new Mishnah films
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-new-mishnah-films-2026-11-14.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mishnah-staged-additions-20261114
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install media tools
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'gdown==5.2.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and verify new MP4 and duplicate candidates
        id: verify
        run: |
          set -euo pipefail
          mkdir -p /tmp/mishnah-add
          cat > /tmp/mishnah-add/check.py <<'PY'
          import concurrent.futures,hashlib,json,subprocess,time
          from pathlib import Path
          import gdown
          base=Path('/tmp/mishnah-add')
          cfg=json.loads(Path('mishnah/new-films-2026-11-14.json').read_text())
          items=cfg['newFilms']
          assert len(items)==15 and len({x['id'] for x in items})==15
          def download(fileid,name):
              path=base/name
              for retry in range(3):
                  try:
                      if path.exists():path.unlink()
                      if not gdown.download(id=fileid,output=str(path),quiet=True):raise Exception('gdown returned no content')
                      size=path.stat().st_size
                      if size<1000000:raise Exception('file too small')
                      sha=hashlib.sha256()
                      with path.open('rb') as stream:
                          for chunk in iter(lambda:stream.read(1024*1024),b''):sha.update(chunk)
                      return size,sha.hexdigest()
                  except Exception:
                      if retry==2:raise
                      time.sleep(retry+1)
          def one(arg):
              i,item=arg
              try:
                  filename='mishnah-added-%02d.mp4'%i
                  size,sha=download(item['id'],filename)
                  assert size==int(item['size']), 'file size changed since Drive listing'
                  probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(base/filename)],capture_output=True,text=True,check=True,timeout=30)
                  duration=float(probe.stdout.strip())
                  assert 15<duration<14400,'implausible duration'
                  print('VERIFIED',i,size,round(duration,2),flush=True)
                  return dict(n=i,id=item['id'],title=item['title'],section=item['section'],label=item['label'],sizeBytes=size,durationSeconds=round(duration,3),sha256=sha,filename=filename)
              except Exception as exc:
                  print('FAILED',i,str(exc)[:140],flush=True)
                  return dict(n=i,id=item['id'],error=str(exc)[:250])
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              allfilms=sorted(pool.map(one,enumerate(items,1)),key=lambda x:x['n'])
          dup=[]
          for a,b in cfg['duplicatePairs']:
              try:
                  xa,ha=download(a,'dup-'+a+'.mp4')
                  xb,hb=download(b,'dup-'+b+'.mp4')
                  dup.append(dict(ids=[a,b],identical=xa==xb and ha==hb,sha256=[ha,hb]))
              except Exception as e:dup.append(dict(ids=[a,b],identical=False,error=str(e)[:160]))
          good=all('error' not in x for x in allfilms) and all(x['identical'] for x in dup)
          result=dict(status='verified' if good else 'blocked',count=len(allfilms),duplicates=dup,items=allfilms)
          (base/'verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print('STAGE_VERIFY',result['status'],len(allfilms),'duplicates',sum(x['identical'] for x in dup),flush=True)
          if not good:raise SystemExit('Source verification failed; do not publish')
          PY
          python3 /tmp/mishnah-add/check.py
      - name: Publish verified additions as an isolated GitHub release
        id: upload
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='mishnah-native-additions-20261114-v1'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Mishnah Berakhot VII-VIII additions" --notes "15 new owner-shared films validated by SHA256 and ffprobe, staged for existing website." --prerelease
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path('/tmp/mishnah-add')
          status=json.loads((root/'verification.json').read_text())
          assert status['status']=='verified'
          for item in status['items']:
              p=subprocess.run(['gh','release','upload','mishnah-native-additions-20261114-v1',str(root/item['filename']),'--clobber'],capture_output=True,text=True,timeout=180)
              if p.returncode:raise RuntimeError('Upload failure '+item['filename']+' '+p.stderr[:300])
              item['url']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/mishnah-native-additions-20261114-v1/'+item['filename']
              print('UPLOAD_OK',item['n'],flush=True)
          status['status']='ready'
          (root/'ready.json').write_text(json.dumps(status,ensure_ascii=False,indent=2))
          PY
          for n in 01 15; do
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/mishnah-added-$n.mp4"
            curl -fLsS -r 0-1023 --max-time 50 -o "/tmp/mishnah-add/test-$n.bin" "$URL"
            python3 - "$n" <<'PY'
          import pathlib,sys
          data=pathlib.Path('/tmp/mishnah-add/test-'+sys.argv[1]+'.bin').read_bytes()
          assert 3<len(data)<=1024 and b'ftyp' in data[:32], 'GitHub did not serve MP4 bytes'
          print('MP4_RANGE_OK',sys.argv[1])
          PY
          done
      - name: Save staged status for the site update
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('/tmp/mishnah-add')
          src=root/'ready.json'
          if not src.exists():src=root/'verification.json'
          status=json.loads(src.read_text()) if src.exists() else dict(status='blocked',items=[])
          status['workflowRunId']=os.environ['RUN_ID']
          status['verifyOutcome']=os.environ['VERIFY_OUTCOME']
          status['uploadOutcome']=os.environ['UPLOAD_OUTCOME']
          if status.get('status')=='ready' and status['uploadOutcome']!='success':status['status']='blocked'
          (root/'status.json').write_text(json.dumps(status,ensure_ascii=False,indent=2))
          PY
          CONTENT="$(base64 -w0 /tmp/mishnah-add/status.json)"
          PATHNAME='mishnah/new-media-ready-2026-11-14.json'
          OLD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATHNAME" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATHNAME" -f message="Update readiness of new Mishnah videos" -f sha="$OLD_SHA" -f content="$CONTENT" >/dev/null
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATHNAME" -f message="Record readiness of new Mishnah videos" -f content="$CONTENT" >/dev/null
          fi
