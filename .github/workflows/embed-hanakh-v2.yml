name: Embed HaNakh HaBahir V2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_hanakh.py
      - run: |
          grep -q '"yt":"dMfyog_Z5EA"' index.html
          grep -q '"yt":"vme74pRb8j8"' index.html
          grep -q '116 מתוך 126' index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Embed all HaNakh HaBahir Judges chapters"
          git push
