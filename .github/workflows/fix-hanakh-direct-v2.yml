name: Guard HaNakh HaBahir truthful fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 21 blocked chapters stay visible and truthful
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.parse

          s = Path("index.html").read_text(encoding="utf-8")
          a = s.index("const DATA=") + len("const DATA=")
          b = s.index(";let filter=", a)
          data = json.loads(s[a:b])

          items = [
              x for x in data["items"]
              if x.get("title", "").startswith("הנ״ך הבהיר — שופטים פרק ")
          ]
          errors = []
          if len(items) != 21:
              errors.append(f"Expected 21 HaNakh chapters, found {len(items)}")

          for x in items:
              if x.get("yt") or x.get("embed") or x.get("directYT"):
                  errors.append(f'{x["title"]}: must not claim an internal embed after the real-browser owner block')
              url = x.get("url") or ""
              if not url.startswith("https://www.youtube.com/watch?v="):
                  errors.append(f'{x["title"]}: missing exact YouTube source fallback')
              else:
                  q = urllib.parse.parse_qs(urllib.parse.urlparse(url).query)
                  vid = (q.get("v") or [None])[0]
                  if not vid or x.get("thumbYT") != vid:
                      errors.append(f'{x["title"]}: thumbnail/source id mismatch')
              if "חוסם את ההטמעה" not in (x.get("note") or ""):
                  errors.append(f'{x["title"]}: missing truthful embed-blocked note')

          glat = next((x for x in data["items"] if x.get("title") == "הנ״ך הבהיר — הפלייליסט המלא של ספר שופטים"), None)
          if not glat or glat.get("url") != "https://glat.tube/category/13218":
              errors.append("Official GlatTube/Kol Halashon playlist fallback is missing")

          if "filter==='playable'||filter==='external'" not in s:
              errors.append("Full chronology filter no longer keeps external fallback items visible")
          if 'id="resumeBtn"' not in s or 'id="chapterJump"' not in s:
              errors.append("Low-effort navigation controls missing")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("Guard OK: 21/21 HaNakh chapters remain in chronology as truthful external fallbacks; GlatTube playlist fallback is present.")
          PY
