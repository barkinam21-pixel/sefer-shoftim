name: Query ShiurPod mirror for Nussbaum Judges
on:
  push:
    branches: [hanakh-crop-final]
    paths:
      - ".github/workflows/query-shiurpod-nussbaum.yml"
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract YouTube description source links directly
        run: |
          python3 - <<'PY'
          import requests,re,json
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141 Safari/537.36','Accept-Language':'he-IL,he;q=0.9,en;q=0.7'}
          for vid in ['dMfyog_Z5EA','xJnDGKQvVCY','4QuUq6MTPFM','vme74pRb8j8']:
            t=requests.get('https://www.youtube.com/watch?v='+vid,headers=h,timeout=25).text
            print('\n===',vid,'===')
            for key in ['shortDescription','description','ownerChannelName']:
              p='"'+key+'":'
              i=t.find(p)
              print(key,'POS',i)
              if i>=0:
                sn=t[i:i+18000]
                print('SNIP',sn[:18000])
                break
          PY
